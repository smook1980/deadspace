AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "test/fixtures/**/*" # a fake app with intentionally odd code
    - "vendor/**/*"
    - "tmp/**/*"

Layout/LineLength:
  Max: 120

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# The AST visitor and liveness pass are inherently branchy; splitting them hurts readability.
Metrics:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames: [m, f, io]

# handle_* methods in the visitor act and return whether they handled the call; `?` would misdescribe them.
Naming/PredicateMethod:
  Enabled: false
